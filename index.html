<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Ailleurs - Affiches de voyage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --bg: #fafaf8;
      --accent: #c17a5c;
      --accent-light: #e8d4c8;
      --border: #e5e5e0;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f5f5f2;
        --text-secondary: #999;
        --bg: #0f0f0d;
        --accent: #d4926d;
        --border: #2a2a28;
      }
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem;
      border-bottom: 0.5px solid var(--border);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    
    nav {
      display: flex;
      gap: 2rem;
    }
    
    nav a {
      text-decoration: none;
      color: var(--text-primary);
      font-size: 14px;
      transition: color 0.2s;
    }
    
    nav a:hover {
      color: var(--accent);
    }
    
    .cart-btn {
      background: none;
      border: 0.5px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .cart-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .hero {
      text-align: center;
      padding: 4rem 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .hero h1 {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    
    .hero p {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    
    .tagline {
      font-style: italic;
      color: var(--accent);
      font-size: 16px;
    }
    
    .hero-image {
      width: 100%;
      height: 400px;
      background: linear-gradient(135deg, var(--accent-light) 0%, #d4c8c0 100%);
      border-radius: 8px;
      margin: 2rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    
    .benefits {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      padding: 3rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      border-top: 0.5px solid var(--border);
    }
    
    .benefit {
      text-align: center;
    }
    
    .benefit h3 {
      font-size: 14px;
      font-weight: 500;
